[alembic]
# Chemin vers le dossier des migrations existant
script_location = alembic

# Ajoute le dossier courant au PYTHONPATH
prepend_sys_path = .

version_path_separator = os

# URL par défaut de la base de données (si non surchargée dans alembic/env.py)
sqlalchemy.url = postgresql+psycopg://postgres:postgres@db:5432/aruba_db

[post_write_hooks]

[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S